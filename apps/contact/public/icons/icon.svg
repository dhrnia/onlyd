<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.3" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle glow ring -->
  <circle cx="256" cy="180" r="160" fill="#2563eb" fill-opacity="0.12" />

  <!-- Contact Card Container -->
  <g filter="url(#shadow)">
    <rect x="96" y="88" width="320" height="336" rx="36" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="3" />
  </g>

  <!-- Header Accent Line -->
  <path d="M 98 124 C 98 106, 112 90, 132 90 L 380 90 C 400 90, 414 106, 414 124 L 414 140 L 98 140 Z" fill="#2563eb" fill-opacity="0.2" />

  <!-- Avatar Profile Circle -->
  <circle cx="256" cy="180" r="48" fill="url(#avatarGrad)" />
  <circle cx="256" cy="168" r="18" fill="#ffffff" />
  <path d="M 230 206 C 230 192, 240 188, 256 188 C 272 188, 282 192, 282 206 C 275 214, 266 218, 256 218 C 246 218, 237 214, 230 206 Z" fill="#ffffff" />

  <!-- Contact Details Simulated Lines -->
  <!-- Name representation -->
  <rect x="176" y="250" width="160" height="18" rx="9" fill="#f8fafc" />
  
  <!-- Info Line 1 (Phone/Mail) -->
  <rect x="156" y="286" width="200" height="12" rx="6" fill="#60a5fa" fill-opacity="0.8" />
  <!-- Info Line 2 (Tag pill) -->
  <rect x="196" y="314" width="120" height="22" rx="11" fill="rgba(37, 99, 235, 0.3)" stroke="#3b82f6" stroke-width="1.5" />
  <rect x="216" y="321" width="80" height="8" rx="4" fill="#93c5fd" />

  <!-- Floating Sync / Cloud Badge at bottom right -->
  <g filter="url(#badgeShadow)">
    <circle cx="376" cy="376" r="46" fill="#2563eb" stroke="#60a5fa" stroke-width="2.5" />
    <!-- Sync / Refresh Arrows Icon inside badge -->
    <path d="M 376 352 C 388.5 352, 399 361.5, 400 373.8 L 406 373.8 L 398 385 L 390 373.8 L 395 373.8 C 394 364.5, 386 357, 376 357 C 367.5 357, 360 362.5, 357.5 370 L 352.5 368.5 C 355.8 359, 365 352, 376 352 Z" fill="#ffffff" />
    <path d="M 376 400 C 363.5 400, 353 390.5, 352 378.2 L 346 378.2 L 354 367 L 362 378.2 L 357 378.2 C 358 387.5, 366 395, 376 395 C 384.5 395, 392 389.5, 394.5 382 L 399.5 383.5 C 396.2 393, 387 400, 376 400 Z" fill="#ffffff" />
  </g>
</svg>